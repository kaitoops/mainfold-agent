<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦴 Hello Cave Man</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .cave-wall {
            background: #2d2d44;
            background-image:
                radial-gradient(ellipse at 20% 50%, #3a3a5c 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, #3a3a5c 0%, transparent 50%);
            padding: 60px 80px;
            border-radius: 100px 100px 60px 60px;
            box-shadow:
                inset 0 0 80px rgba(0,0,0,0.5),
                0 0 40px rgba(255, 150, 50, 0.1);
            border: 3px solid #4a4a6a;
            position: relative;
            text-align: center;
        }
        .cave-wall::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 30px;
            background: #3a3a5c;
            border-radius: 30px 30px 0 0;
            border: 2px solid #4a4a6a;
            border-bottom: none;
        }
        .fire {
            font-size: 60px;
            margin-bottom: 20px;
            animation: flicker 1.5s ease-in-out infinite alternate;
        }
        h1 {
            font-size: 64px;
            color: #ffd700;
            text-shadow:
                0 0 20px rgba(255, 215, 0, 0.6),
                0 0 40px rgba(255, 150, 50, 0.3);
            letter-spacing: 6px;
            margin-bottom: 10px;
        }
        .sub {
            font-size: 20px;
            color: #a0a0c0;
            letter-spacing: 3px;
        }
        .bones {
            margin-top: 30px;
            font-size: 36px;
        }
        @keyframes flicker {
            0%   { text-shadow: 0 0 10px #ff6600; }
            50%  { text-shadow: 0 0 25px #ffaa00, 0 0 50px #ff660033; }
            100% { text-shadow: 0 0 15px #ff7700; }
        }
    </style>
</head>
<body>
    <div class="cave-wall">
        <div class="fire">🔥</div>
        <h1>🦴 HELLO CAVE MAN</h1>
        <div class="sub">⚡ unga bunga · welcome ⚡</div>
        <div class="bones">🦴 🪨 🗿 🦴</div>
    </div>
</body>
</html>
